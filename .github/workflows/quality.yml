name: Site quality

on:
  push:
    branches: [main, "codex/**", "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  local-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check local links and PWA assets
        run: python scripts/check_site.py
